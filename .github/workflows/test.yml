name: Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
    
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r tests/requirements.txt
        pip install -e .
    
    - name: Configure test profile
      env:
        CATO_ACCOUNT_ID: ${{ secrets.CATO_ACCOUNT_ID }}
        CATO_API_KEY: ${{ secrets.CATO_API_KEY }}
        CATO_BASE_URL: ${{ secrets.CATO_BASE_URL }}
        CATO_SCIM_URL: ${{ secrets.CATO_SCIM_URL }}
        CATO_SCIM_TOKEN: ${{ secrets.CATO_SCIM_TOKEN }}
      run: |
        catocli configure set --profile ci \
          --account-id "$CATO_ACCOUNT_ID" \
          --cato-token "$CATO_API_KEY" \
          --endpoint "$CATO_BASE_URL" \
          --scim-url "$CATO_SCIM_URL" \
          --scim-token "$CATO_SCIM_TOKEN" \
          --skip-validation
        catocli configure use ci
    
    - name: Run all test suites
      run: |
        python3 -m pytest tests/test_generated_graphql_payloads.py tests/test_example_variables.py tests/test_generator_regressions.py tests/test_private_boolean_arguments.py
        python3 tests/run_all_tests.py --verbose
